# render.yaml — DotSync Render deployment config
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: dotsync-server
    runtime: go
    plan: starter          # change to standard/pro for production
    region: oregon         # options: oregon, frankfurt, singapore, ohio
    branch: main

    buildCommand: "go mod tidy && go build -ldflags='-s -w' -o dotsync-server ./cmd/dotsync"
    startCommand: "./dotsync-server"

    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: PORT
        value: "10000"          # Render assigns this automatically; keep in sync

      # Render terminates TLS in front of the service, so the app must read the
      # client IP from X-Forwarded-For for rate limiting to work. Only enable
      # this behind a trusted proxy: otherwise clients can spoof their IP.
      - key: TRUST_PROXY
        value: "true"

      # Optional. Only set this if a browser frontend on another origin must
      # call the API with credentials. Leave unset and CORS stays disabled.
      - key: FRONTEND_URL
        sync: false

      - key: MIGRATIONS_PATH
        value: ./migrations

      - key: DATABASE_URL
        sync: false             # paste your Neon pooled connection string in the Render dashboard
                                 # format: postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/dbname?sslmode=require

      - key: DATABASE_URL_DIRECT
        sync: false             # Neon's DIRECT (unpooled) connection string — use for migrations
                                 # format: postgresql://user:pass@ep-xxx.region.aws.neon.tech/dbname?sslmode=require

      - key: JWT_SECRET
        generateValue: true     # must be >= 32 bytes and different from SERVER_MASTER_KEY

      - key: SERVER_MASTER_KEY
        generateValue: true     # 32-byte hex key used to encrypt project passwords at rest
                                 # (server-side; see internal/service.PasswordService).
                                 # Never change this after the first password is stored, or
                                 # existing project passwords become undecryptable.

      - key: GITHUB_CLIENT_ID
        sync: false             # set in Render dashboard
                                 # GITHUB_CLIENT_SECRET is NOT needed here — login uses
                                 # GitHub's Device Flow; the server never participates in
                                 # the token exchange and never needs the secret.

      # ── Optional database pool tuning ─────────────────────────────────────
      # Defaults are fine for most deployments. Lower DB_MAX_OPEN_CONNS when
      # using a pooled Neon endpoint with a small connection limit.
      # - key: DB_MAX_OPEN_CONNS
      #   value: "25"
      # - key: DB_MAX_IDLE_CONNS
      #   value: "10"
      # - key: DB_CONN_MAX_LIFETIME_MIN
      #   value: "30"

# Database is hosted on Neon (https://neon.tech), not Render —
# create a project there and paste both connection strings above.
# No `databases:` block needed since Neon manages it independently.
