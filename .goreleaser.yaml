version: 2

project_name: dotsync

before:
  hooks:
    # Tests and tidiness are gated in .github/workflows/release.yml; build only.
    - go build ./...

builds:
  - id: dotsync
    # The CLI lives at the repo root (main.go imports cli/cmd)
    main: .
    binary: dotsync
    ldflags:
      - -s -w
      # Keep the tag prefix ("v3.6.0") so `dotsync version` and the update
      # summary print the same string users see on the release page.
      - -X github.com/Pruthviraj36/dotsync/cli/cmd.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: dotsync
    ids: [dotsync]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  groups:
    - title: "🐛 Bug Fixes"
      regexp: "^fix"
      order: 0
    - title: "✨ Features"
      regexp: "^feat"
      order: 1
    - title: "🔧 Other Changes"
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"
      - "Merge pull request"

release:
  github:
    owner: Pruthviraj36
    name: dotsync
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
